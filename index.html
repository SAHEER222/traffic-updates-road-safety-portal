<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e2a52" />
<title>Traffic Updates | Road Safety Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#0f172a; --ink2:#475569; --mute:#7b8aa0; --line:#e3e8ef;
  --navy:#0e2a52; --navy2:#173b73; --amber:#f59e0b; --amber-ink:#4a2f00;
  --red:#dc2626; --orange:#ea580c; --green:#16a34a; --blue:#2563eb;
  --red-bg:#fef2f2; --orange-bg:#fff7ed; --green-bg:#f0fdf4; --blue-bg:#eff6ff; --amber-bg:#fffbeb;
  --r:14px; --sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
  --f:'Inter','Noto Sans Malayalam','Noto Sans Devanagari','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1120; --card:#111b30; --ink:#e8edf5; --ink2:#b3bfd1; --mute:#7f8ea6; --line:#22304a;
    --red-bg:#2b1517; --orange-bg:#2b1c10; --green-bg:#0f2a1b; --blue-bg:#102241; --amber-bg:#2a2210;
    --sh:0 1px 0 rgba(255,255,255,.03);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-weight:700;line-height:1.35;letter-spacing:-.005em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 12px;border-radius:8px;z-index:999}
.skip:focus{left:8px}

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;line-height:1.3;background:var(--amber);color:var(--amber-ink);transition:filter .15s,transform .05s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.wa{background:#1fa855;color:#fff}
.btn.ch{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.ch:hover{background:rgba(255,255,255,.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}

/* =====================================================================
   FLASH BAR
   ===================================================================== */
.flash{background:var(--red-bg);border-bottom:1px solid color-mix(in srgb,var(--red) 28%,transparent);color:var(--ink)}
.flash .wrap{display:flex;align-items:center;gap:12px;padding-top:9px;padding-bottom:9px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 0 rgba(220,38,38,.55);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.flash-text{flex:1;min-width:0;background:none;border:0;text-align:left;font-weight:600;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.flash-time{font-size:12.5px;color:var(--ink2);white-space:nowrap}

/* =====================================================================
   HEADER + NAV
   ===================================================================== */
.topbar{background:var(--navy);color:#fff}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.01em;color:#fff}
.brand small{display:block;font-size:12.5px;color:#b9c8e3;line-height:1.35}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#d6e0f2;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.lang button[aria-pressed=true]{background:var(--amber);color:var(--amber-ink)}
.lang button:not([aria-pressed=true]):hover{background:rgba(255,255,255,.12)}
.gantry{background:var(--navy2);position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(8,20,45,.25)}
.gantry .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.gantry .wrap::-webkit-scrollbar{display:none}
.navlink{flex:none;border:0;background:transparent;color:#cbd8ee;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s}
.navlink:hover{background:rgba(255,255,255,.1);color:#fff}
.navlink.active{background:var(--amber);color:var(--amber-ink)}
.navlink.hot:not(.active){background:rgba(220,38,38,.9);color:#fff}

/* =====================================================================
   LAYOUT + COMMON
   ===================================================================== */
main{padding:28px 0 56px}
.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.eyebrow.red{color:var(--red)}
.section-title{font-size:26px;margin-bottom:6px}
.section-sub{color:var(--ink2);max-width:760px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{color:var(--ink2);font-size:14px}
.empty{color:var(--mute);text-align:center;padding:28px 12px;font-size:14px;grid-column:1/-1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;line-height:1.5}
.badge.high{background:var(--red-bg);color:var(--red)}
.badge.medium{background:var(--orange-bg);color:var(--orange)}
.badge.low{background:var(--green-bg);color:var(--green)}
.badge.sample{background:var(--bg);color:var(--mute);border:1px dashed var(--line);font-weight:600}
.badge.exp{background:var(--blue-bg);color:var(--blue);font-weight:600}
.badge.exp.soon{background:var(--orange-bg);color:var(--orange)}

/* hero */
.hero{padding:28px}
.hero h2{font-size:clamp(24px,4vw,34px);margin:2px 0 10px;line-height:1.35}
.hero .lead{font-size:16px;color:var(--ink2);max-width:760px;margin-bottom:14px}
.hero-features{font-weight:700;font-size:14.5px;color:var(--navy);max-width:820px;margin-bottom:8px;line-height:1.8}
.hero-close{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:22px}
@media (prefers-color-scheme:dark){.hero-features{color:#8db6ff}}
.vms{display:flex;background:var(--navy);color:#fff;border-radius:12px;overflow:hidden;margin-bottom:0}
.vms-label{display:flex;align-items:center;gap:8px;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:12.5px;letter-spacing:.06em;padding:0 16px;flex:none;text-transform:uppercase}
.vms-label .pulse{background:var(--amber-ink);animation:none;box-shadow:none}
.vms-win{overflow:hidden;flex:1;min-width:0}
.vms-track{display:inline-flex;white-space:nowrap;padding:12px 0;animation:ticker 60s linear infinite;will-change:transform}
.vms-track span{padding:0 34px;font-size:14px}
.vms:hover .vms-track{animation-play-state:paused}
@keyframes ticker{to{transform:translateX(-50%)}}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.stat b{color:#8db6ff}}
.stat span{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px}
.quick-title{font-size:18px;margin:26px 0 12px}
.quicklink-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.quicklink{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh)}
.quicklink:hover{transform:translateY(-2px);border-color:var(--amber)}
.quicklink .ic{font-size:26px;line-height:1;margin-bottom:8px}
.quicklink h3{font-size:15.5px;margin-bottom:2px}
.quicklink p{font-size:13px;color:var(--ink2)}
.quicklink.hot{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-bg)}
.quicklink.hot h3{color:var(--red)}

/* alert cards */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.filter-btn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.alert-card{position:relative;padding:18px 18px 16px 22px;overflow:hidden}
.alert-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.alert-card.high::before{background:var(--red)}.alert-card.medium::before{background:var(--orange)}.alert-card.low::before{background:var(--green)}
.ac-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ac-time{margin-left:auto;font-size:12.5px;color:var(--mute)}
.alert-card h3{font-size:17px;margin-bottom:2px}
.alert-card .meta{font-size:13px;color:var(--ink2);margin-bottom:4px}
.alert-card .desc{margin:6px 0 14px}
.ac-act{display:flex;gap:8px;flex-wrap:wrap}

/* weather */
.weather-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.weather-card{text-align:center;padding:18px 12px}
.weather-card .ic{font-size:34px;line-height:1.2}
.weather-card h3{font-size:14.5px;margin:4px 0 0}
.weather-card .temp{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.weather-card .cond{font-size:12.5px;color:var(--ink2)}
.wx-note{font-size:12px;color:var(--mute);margin:6px 0 26px}
.sub-h{font-size:17px;margin:4px 0 12px}

/* tips + emergency */
.tip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tip-grid .ic{font-size:30px;line-height:1;margin-bottom:10px}
.school-banner{background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:var(--r);padding:14px 18px;margin-bottom:18px;font-size:14.5px}
.emg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.emg-card{display:flex;align-items:center;gap:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.emg-card:hover{border-color:var(--amber);transform:translateY(-2px)}
.emg-card .circle{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.emg-card h3{font-size:14.5px;margin:0}
.emg-card .dial{font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3}
@media (prefers-color-scheme:dark){.emg-card .dial{color:#8db6ff}}

/* forms */
.two-col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:26px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
input[type=text],input[type=tel],input[type=password],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
input[type=file]{width:100%;font-size:13.5px}
textarea{resize:vertical;min-height:92px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.checks label:has(input:checked){background:var(--green-bg);border-color:var(--green)}
.msg-ok{display:none;margin-top:12px;background:var(--green-bg);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600}
.howto{list-style:none;font-size:14px;color:var(--ink2);line-height:2.0}
.howto b{color:var(--ink)}
.note{margin-top:14px;padding:12px 14px;background:var(--bg);border-left:4px solid var(--red);border-radius:8px;font-size:13.5px;color:var(--ink2)}
.note b{color:var(--red)}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}
.hint-blue{margin-top:10px;font-size:12.5px;color:var(--blue)}

/* lost & found */
.lf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.lf-col{background:var(--card);border:1px solid var(--line);border-top:4px solid;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.lf-col.lost{border-top-color:var(--red)}.lf-col.found{border-top-color:var(--green)}.lf-col.missing{border-top-color:var(--orange)}
.lf-col>h3{font-size:16px;margin:2px 4px 12px;display:flex;align-items:center;gap:8px}
.lf-col .count{margin-left:auto;font-size:12px;font-weight:700;background:var(--bg);color:var(--ink2);padding:2px 10px;border-radius:999px}
.lf-item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lf-img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--line)}
.lf-desc{font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere}
.lf-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.lf-contact{font-size:13px;color:var(--blue);margin-top:6px;overflow-wrap:anywhere}
.lf-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lf-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* groups + support */
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.channel-card{display:flex;gap:14px;align-items:flex-start}
.channel-card .ic{font-size:30px;line-height:1}
.join-link{display:inline-block;margin-top:8px;font-weight:700;font-size:14px;color:var(--blue)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.g{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;background:var(--card)}
.g a{color:var(--blue);font-weight:700;font-size:13px}
.support-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.support-grid .ic{font-size:26px;line-height:1}
.support-grid h3{margin-top:10px}
.upi-box{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.upi-box span{font-weight:600;font-size:14px;overflow-wrap:anywhere}

footer{border-top:1px solid var(--line);padding:26px 0 34px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.9}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12.5px}

/* =====================================================================
   DIALOGS, TOAST, ADMIN
   ===================================================================== */
dialog{border:0;border-radius:18px;width:calc(100% - 24px);max-width:640px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4);margin:auto}
dialog::backdrop{background:rgba(8,16,34,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:17px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--ink2);padding:0 4px}
.db{padding:18px;max-height:78vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.langs label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.langs label:has(input:checked){background:var(--blue-bg);border-color:var(--blue)}
#shText{min-height:200px;font-size:13.5px;line-height:1.55}
.sh-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.adm-only{display:none!important}
body.is-admin .adm-only{display:inline-flex!important}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;background:var(--navy);color:#fff;border:2px solid var(--amber);border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);align-items:center;gap:8px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
details.acc>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';color:var(--mute)}
details.acc[open]>summary::after{content:'▴'}
.acc-b{padding:4px 14px 14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tx-group{margin-bottom:14px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.tx-k{font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--navy)}
@media (prefers-color-scheme:dark){.tx-k{color:#8db6ff}}
.stamp{font-weight:600;color:var(--ink2)}
.flash-adm{display:none;gap:6px}
.flash.muted{opacity:.8}
@media (max-width:640px){.row3{grid-template-columns:1fr 1fr}}

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width:980px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .lf-grid{grid-template-columns:1fr}
  .quicklink-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 14px}
  main{padding:18px 0 90px}
  .flash-time{display:none}
  .flash-text{font-size:13.5px}
  .topbar-in{padding-top:12px;padding-bottom:12px;gap:12px}
  .brand-mark{width:42px;height:42px}
  .brand h1{font-size:17px}
  .hdr-right{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hdr-right .lang{grid-column:1/-1;justify-content:space-between}
  .lang button{flex:1;padding:8px 6px;font-size:13px}
  .hdr-right .btn{width:100%;padding:10px 8px}
  .section-title{font-size:22px}
  .hero{padding:18px}
  .hero .lead{font-size:15px}
  .vms-label{padding:0 10px;font-size:11.5px}
  .stat b{font-size:24px}

function rel(ts){
  const m=Math.round((Date.now()-ts)/6e4), r=new Intl.RelativeTimeFormat(LOC(),{numeric:'auto'});
  if(m<1)return r.format(0,'minute'); if(m<60)return r.format(-m,'minute');

}

  try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}

}

async function loadRemote(){

  }catch(e){}

function loadLF(){
  let a=sget('traffic_lostfound',null);
  if(!Array.isArray(a))a=DATA_URL?[]:seedLF();
  a.forEach(i=>{ // migrate posts made by the earlier version of this page
    if(i.id===1||i.id===2||i.id===3){if(!('sample' in i))i.sample=true}
    if(!i.timestamp)i.timestamp=Date.now();
    if(!i.exp)i.exp=i.timestamp+(LF_DAYS[i.type]||30)*D;
  });
  lf=a;purge();saveLF();
}
/* remove everything whose validity has ended */
function purge(){
  const n=Date.now(), a0=alerts.length, l0=lf.length;
  alerts=alerts.filter(a=>!a.exp||a.exp>n); lf=lf.filter(i=>!i.exp||i.exp>n);
  if(a0!==alerts.length&&hasKey('tu_alerts2'))saveAlerts(); if(l0!==lf.length)saveLF();
  return a0!==alerts.length||l0!==lf.length;
}

    const k=d?wmo(d.code):null;
    return `<div class="card weather-card"><div class="ic">${k?WX_ICON[k]:'🌡️'}</div><h3>${esc(tx(c.n))}</h3><div class="temp">${d?d.tmp+'°C':'—'}</div><div class="cond">${k?esc(t('w_'+k)):'&nbsp;'}</div></div>`;
  }).join('');
  $('#wxNote').textContent=wx&&wx.d?t('wxSrc',{t:new Date(wx.t).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'})}):t('wxFail');

async function loadWeather(){
  const c=sget('tu_wx',null);
  if(c&&c.d&&Date.now()-c.t<30*60e3){wx=c;renderWeather();return}
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+CITIES.map(x=>x.lat).join(',')+'&longitude='+CITIES.map(x=>x.lon).join(',')+'&current=temperature_2m,weather_code&timezone=Asia%2FKolkata';
    const r=await fetch(url);if(!r.ok)throw 0;
    const j=await r.json(), arr=Array.isArray(j)?j:[j];
    wx={t:Date.now(),d:arr.map(x=>({tmp:Math.round(x.current.temperature_2m),code:x.current.weather_code}))};
    sset('tu_wx',wx);
  }catch(e){if(c&&c.d)wx=c}
  renderWeather();
}

}

/* =====================================================================
   SHARE (WhatsApp-ready text, multi-language)
   ===================================================================== */
let shBuild=null, shLangs=[];
function openShare(build){
  shBuild=build;shLangs=[lang];
  $('#shLangBox').innerHTML=LANGS.map(l=>`<label><input type="checkbox" value="${l.c}" ${l.c===lang?'checked':''}> ${l.n}</label>`).join('');
  updShare();$('#shDlg').showModal();
}
function updShare(){const txt=shBuild(shLangs);$('#shText').value=txt;$('#shWa').href='https://wa.me/?text='+encodeURIComponent(txt)}
function foot(){return ['','— Traffic Updates','📢 '+CHANNEL]}
function alertShare(a){return langs=>{
  const first=langs[0], ev=EVENTS[a.type]||EVENTS.roadblock;
  const head=`${a.icon||ev.ic} *${tx2(T['k_'+a.kind],first)}*${a.kind==='advisory'?'':' · '+tx2(T['s_'+a.sev],first)}`;
  const out=[head];
  const place=tx2(a.place,first); if(place)out.push('📍 *'+place+'*'); out.push('');
  langs.forEach(l=>out.push(tx2(a.desc,l)));
  out.push('','🕒 '+fmtDT(a.ts,first),...foot());
  return out.join('\n');
}}
function lfShare(i){return langs=>{
  const first=langs[0], m=LF_META[i.type];
  const out=[`${m.ic} *${tx2(T[m.k],first)}* — ${tx2(T.nav_lostfound,first)}`,''];
  out.push(tx2(i.desc,first),'');
  out.push('📍 '+tx2(i.place,first),'📅 '+new Date(i.date+'T00:00:00').toLocaleDateString((LANGS.find(l=>l.c===first)||{}).loc,{day:'2-digit',month:'short',year:'numeric'}));
  if(i.contact)out.push('📞 '+i.contact);
  out.push(...foot());
  return out.join('\n');
}}
const tx2=(v,lg)=>typeof v==='string'?v:(v&&(v[lg]||v.ml||v.en||Object.values(v).find(Boolean)))||'';

function setAdmin(on){admin=on;document.body.classList.toggle('is-admin',on);try{sessionStorage.setItem('tu_admin',on?'1':'')}catch(e){}renderFlash()}
const hashStr=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const passOk=v=>{const s=getS();return s.passHash?hashStr(v)===s.passHash:v===ADMIN_PIN};
const toLocalInput=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*6e4).toISOString().slice(0,16);

function resetAlertForm(){

function startEdit(id){
  const a=alerts.find(x=>x.id===id);if(!a)return;
  editId=id;fillAdmin();
  $('#aKind').value=a.kind;$('#aType').value=EVENTS[a.type]?a.type:'roadblock';$('#aSev').value=a.sev;

$('#alCancel').onclick=()=>{resetAlertForm()};
$('#alForm').onsubmit=e=>{
  e.preventDefault();
  if(!admin)return;
  const kind=$('#aKind').value, type=$('#aType').value, place=$('#aPlace').value.trim();
  const din={};LANGS.forEach(l=>din[l.c]=$('#aD_'+l.c).value.trim());
  if(!place&&!(kind==='advisory'&&Object.values(din).some(Boolean))){toast(t('needPlace'));return}
  const desc={};LANGS.forEach(l=>desc[l.c]=din[l.c]||EVENTS[type].d[l.c].replace('{p}',place));
  const ts=$('#aTime').value?new Date($('#aTime').value).getTime():Date.now();
  const sev=$('#aSev').value, status=kind==='accident'?($('#aStatus').value||null):null, ex=$('#aExp').value;
  if(editId){
    const a=alerts.find(x=>x.id===editId);
    if(a){
      const oldType=a.type;
      a.kind=kind;a.type=type;a.sev=sev;a.desc=desc;a.status=status;a.ts=ts;
      a.place=(editPlaceObj&&place===$('#aPlace').dataset.orig)?editPlaceObj:place;
      if(kind==='advisory'){a.icon=(a.icon&&oldType===type)?a.icon:EVENTS[type].ic}else delete a.icon;
      if(ex!=='keep')a.exp=Date.now()+(+ex)*H;
      delete a.sample;
    }
  }else{
    const o={id:uid(),kind,sev,type,place,desc,status,ts,exp:Date.now()+(+ex||24)*H};
    if(kind==='advisory')o.icon=EVENTS[type].ic;
    alerts.push(o);
  }

  const was=!!editId;resetAlertForm();refresh();$('#admDlg').close();toast(t(was?'updated':'published'));

};

document.addEventListener('click',e=>{
  const nv=e.target.closest('[data-nav]'); if(nv){showPanel(nv.dataset.nav);return}
  const lg=e.target.closest('[data-lang]'); if(lg){lang=lg.dataset.lang;try{localStorage.setItem('tu_lang',lang)}catch(_){ }renderAll();return}
  const fl=e.target.closest('[data-filter]'); if(fl){trFilter=fl.dataset.filter;renderTraffic();return}
  const cl=e.target.closest('[data-close]'); if(cl){cl.closest('dialog').close();return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==='share-al'){const a=alerts.find(x=>x.id===id);if(a)openShare(alertShare(a))}
  else if(act==='share-lf'){const i=lf.find(x=>String(x.id)===String(id));if(i)openShare(lfShare(i))}
  else if(act==='edit-al'){if(admin)startEdit(id)}
  else if(act==='del-al'){if(!admin||!confirm(t('delConfirm')))return;alerts=alerts.filter(x=>x.id!==id);saveAlerts();refresh();toast(t('deleted'))}
  else if(act==='del-lf'){if(!admin||!confirm(t('delConfirm')))return;lf=lf.filter(x=>String(x.id)!==String(id));saveLF();refresh();toast(t('deleted'))}
  else if(act==='ext-lf'){if(!admin)return;const i=lf.find(x=>String(x.id)===String(id));if(i){i.exp=Date.now()+(LF_DAYS[i.type]||30)*D;saveLF();refresh();toast(t('extended'))}}
  else if(act==='resolve-lf'){if(!confirm(t('lfConfirm')))return;lf=lf.filter(x=>String(x.id)!==String(id));saveLF();refresh();toast(t('lfClosed'))}
  else if(act==='banner-edit'){if(admin)openAdmin('dBanner')}
  else if(act==='banner-del'){if(!admin||!confirm(t('delConfirm')))return;sset('tu_banner',{off:true});renderFlash();toast(t('deleted'))}
});

/* lost & found form */
function compress(file,max,q){return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};
    im.onerror=()=>res('');im.src=fr.result};
  fr.onerror=()=>res('');fr.readAsDataURL(file)})}
$('#lostFoundForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const type=$('#lfType').value, desc=$('#lfDesc').value.trim(), place=$('#lfPlace').value.trim(), date=$('#lfDate').value, contact=$('#lfContact').value.trim(), f=$('#lfImage').files[0];
  if(!desc||!place||!date){toast(t('lfReq'));return}
  const image=f?await compress(f,900,.72):'';
  const n=Date.now(), item={id:n,type,desc,place,date,contact,image,timestamp:n,exp:n+(LF_DAYS[type]||30)*D};
  lf.push(item);
  if(!saveLF()){lf.pop();toast(t('storageFull'));return}
  renderLF();renderStats();buildTicker();
  const ok=$('#lfSuccess');ok.textContent='✅ '+t('lfOk');ok.style.display='block';
  $('#lostFoundForm').reset();$('#lfDate').value=new Date().toISOString().slice(0,10);
  setTimeout(()=>ok.style.display='none',4500);
});
